name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4.11
        env:
          # Disposable CI service credentials, never production secrets.
          MYSQL_ROOT_PASSWORD: TaskFlow-CI-root-only-84!
          MYSQL_DATABASE: taskflow_test
          MYSQL_USER: taskflow_test
          MYSQL_PASSWORD: TaskFlow-CI-test-only-84!
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: TaskFlow-BE/**/packages.lock.json
      - name: Restore locked dependencies and EF tooling
        run: |
          dotnet restore TaskFlow.slnx --locked-mode
          dotnet tool restore
      - name: Build
        run: dotnet build TaskFlow.slnx --configuration Release --no-restore
      - name: Check migration snapshot
        env:
          ConnectionStrings__TaskFlow: Server=127.0.0.1;Database=taskflow_design;User ID=unused;Password=unused
        run: dotnet ef migrations has-pending-model-changes --project TaskFlow-BE/TaskFlow.Infrastructure --startup-project TaskFlow-BE/TaskFlow.Api --configuration Release --no-build
      - name: Test against MySQL
        env:
          TASKFLOW_REQUIRE_MYSQL: 'true'
          TASKFLOW_TEST_CONNECTION: Server=127.0.0.1;Port=${{ job.services.mysql.ports['3306'] }};Database=taskflow_test;User ID=taskflow_test;Password=TaskFlow-CI-test-only-84!
        run: dotnet test TaskFlow.slnx --configuration Release --no-build --no-restore --logger "trx;LogFileName=backend.trx" --results-directory TestResults/backend --collect:"XPlat Code Coverage"
      - name: Require executed tests with no skips
        run: python3 scripts/verify_test_results.py TestResults/backend/backend.trx
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-test-results
          path: TestResults/backend/
          retention-days: 7
          if-no-files-found: warn

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: TaskFlow-FE
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: TaskFlow-FE/.nvmrc
          cache: npm
          cache-dependency-path: TaskFlow-FE/package-lock.json
      - name: Use pinned npm
        run: npm install --global npm@11.3.0
      - name: Install locked dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Component tests
        run: npm run test:ci
      - name: Production build
        run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frontend-test-results
          path: TaskFlow-FE/test-results/
          retention-days: 7
          if-no-files-found: warn

  deployment:
    name: Deployment smoke
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TASKFLOW_HOST: localhost
      TASKFLOW_BIND_ADDRESS: 127.0.0.1
      TASKFLOW_HTTPS_PORT: '8443'
      TASKFLOW_DEPLOY_SECRETS_DIR: ${{ github.workspace }}/.local/deployment-ci
      # Disposable CI account; never a deployed or production credential.
      TASKFLOW_SMOKE_EMAIL: ci-smoke@example.test
      TASKFLOW_SMOKE_PASSWORD: TaskFlow-CI-smoke-only-123!
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare isolated secrets and localhost TLS certificate
        run: |
          python3 - <<'PY'
          import os, secrets, subprocess
          from pathlib import Path
          directory = Path(os.environ['TASKFLOW_DEPLOY_SECRETS_DIR'])
          directory.mkdir(parents=True, mode=0o700)
          password = secrets.token_urlsafe(32)
          files = {
              'mysql_password': password,
              'mysql_root_password': secrets.token_urlsafe(32),
              'ConnectionStrings__TaskFlow': f'Server=mysql;Database=taskflow;User ID=taskflow;Password={password};SslMode=Disabled',
              'Kestrel__Certificates__Default__Password': secrets.token_urlsafe(32),
          }
          for name, value in files.items():
              (directory / name).write_text(value)
          subprocess.run(['openssl', 'req', '-x509', '-newkey', 'rsa:2048', '-nodes', '-days', '2',
              '-subj', '/CN=localhost', '-addext', 'subjectAltName=DNS:localhost',
              '-keyout', str(directory / 'tls.key'), '-out', str(directory / 'tls.pem')], check=True,
              stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          subprocess.run(['openssl', 'pkcs12', '-export', '-inkey', str(directory / 'tls.key'),
              '-in', str(directory / 'tls.pem'), '-out', str(directory / 'tls.pfx'),
              '-passout', 'file:' + str(directory / 'Kestrel__Certificates__Default__Password')], check=True)
          for name in [*files, 'tls.pfx']:
              (directory / name).chmod(0o444)
          PY
      - name: Validate and build deployment images
        run: |
          docker compose -p taskflow-deploy-ci -f compose.deploy.yaml --profile tools config --quiet
          docker compose -p taskflow-deploy-ci -f compose.deploy.yaml --profile tools build app migrate
      - name: Start private MySQL and deliberately apply migrations
        run: |
          docker compose -p taskflow-deploy-ci -f compose.deploy.yaml up -d --wait --wait-timeout 180 mysql
          docker compose -p taskflow-deploy-ci -f compose.deploy.yaml --profile tools run --rm migrate
          docker compose -p taskflow-deploy-ci -f compose.deploy.yaml up -d app
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 2 --cacert "$TASKFLOW_DEPLOY_SECRETS_DIR/tls.pem" https://localhost:8443/api/v1/health/ready
      - name: Verify published shell and authentication
        run: python3 scripts/smoke_deployment.py https://localhost:8443 --ca-file "$TASKFLOW_DEPLOY_SECRETS_DIR/tls.pem" --register --keep-session .local/restart-session.lwp
      - name: Recreate app and verify persisted session and logout revocation
        run: |
          docker compose -p taskflow-deploy-ci -f compose.deploy.yaml up -d --force-recreate app
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 2 --cacert "$TASKFLOW_DEPLOY_SECRETS_DIR/tls.pem" https://localhost:8443/api/v1/health/ready
          python3 scripts/smoke_deployment.py https://localhost:8443 --ca-file "$TASKFLOW_DEPLOY_SECRETS_DIR/tls.pem" --resume-session .local/restart-session.lwp
      - name: Remove disposable CI services and volumes
        if: always()
        run: docker compose -p taskflow-deploy-ci -f compose.deploy.yaml down --volumes --remove-orphans
