name: taskflow

services:
  mysql:
    image: mysql:8.4.12
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${TASKFLOW_MYSQL_ROOT_PASSWORD:?Set a local root password in .env}
      MYSQL_DATABASE: taskflow_dev
      MYSQL_USER: taskflow
      MYSQL_PASSWORD: ${TASKFLOW_MYSQL_PASSWORD:?Set a local application password in .env}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--host=127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mysql-data:
